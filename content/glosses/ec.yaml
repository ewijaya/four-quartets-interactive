  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, pp. 938–39"
      status: verified

- movement: 2
  lemma: "fancy lights"
  hint: 42
  kind: sense
  gloss: "Illusory lights, like the will-o'-the-wisp that lures night travellers into bogs; Milton compares Satan to one."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 939"
      status: verified

- movement: 3
  lemma: "interstellar"
