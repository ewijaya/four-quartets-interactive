- movement: 4
  lemma: "plies"
  hint: 1
  kind: sense
  gloss: "Works steadily with (a tool)."

- movement: 4
  lemma: "distempered"
  hint: 2
  kind: sense
  gloss: "Diseased, disordered; in older medicine, with the body's humours out of balance. Milton uses the word of Adam after the Fall."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 948"
      status: verified

- movement: 4
  lemma: "fever chart"
  hint: 5
  kind: sense
  gloss: "The chart at a hospital bed that records a patient's temperature."

- movement: 4
  lemma: "Adam's curse"
  hint: 9
  kind: name
  gloss: "The punishment laid on Adam and all his descendants after the Fall: toil, suffering and death (Genesis 3)."

- movement: 4
  lemma: "Endowed"
  hint: 12
  kind: sense
  gloss: "Given a permanent fund, as a benefactor endows a hospital."

- movement: 4
  lemma: "prevents"
  hint: 15
  kind: archaic
  gloss: "In the old theological sense, ‘goes before’: God's grace anticipates and guides us, as in the Prayer Book's prayer ‘that thy grace may always prevent and follow us’. Eliot changed the word from *torments* after first publication."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 949"
      status: verified

- movement: 4
  lemma: "purgatorial"
  hint: 19
  kind: sense
  gloss: "Of purgatory, where in Catholic teaching souls are cleansed by suffering before they enter heaven."

- movement: 4
  lemma: "briars"
  hint: 20
  kind: sense
  gloss: "Thorny stems of the wild rose: flame and smoke, rose and thorn together."

- movement: 4
  lemma: "substantial"
  hint: 24
  kind: sense
  gloss: "Solid, real. The phrase also has a history in old arguments over whether Christ's ‘substantial flesh and blood’ is eaten in the Eucharist."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, pp. 949–50"
      status: verified

- movement: 5
