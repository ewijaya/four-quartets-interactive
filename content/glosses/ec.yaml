      locator: "vol. I, p. 938"
      status: verified

- movement: 2
  lemma: "grimpen"
  hint: 41
  kind: coinage
  gloss: "A treacherous bog: Eliot's common noun made from the Grimpen Mire in Conan Doyle's *The Hound of the Baskervilles*."
