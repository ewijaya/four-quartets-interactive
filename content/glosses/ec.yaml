# East Coker — word glosses. See the header of bn.yaml for the fields.

- movement: 1
  lemma: "by-pass"
  hint: 4
  kind: sense
  gloss: "A road built to take traffic round a town rather than through it. The *OED*'s earliest example is from 1922, so it was a new word; Eliot considered other endings for the line and kept this one."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 929"
      status: verified

- movement: 1
  lemma: "generation"
  hint: 10
  kind: sense
  gloss: "Begetting, the producing of offspring, as well as a generation of people."

- movement: 1
  lemma: "wainscot"
  hint: 12
  kind: sense
  gloss: "Wooden panelling on the lower part of a room's walls."
  say: "wainsk't"
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 931"
      status: verified

- movement: 1
  lemma: "arras"
  hint: 13
  kind: sense
  gloss: "A tapestry wall-hanging, named from Arras in Flanders, famous for its weaving. The first printing used the Tudor spelling *aresse*, taken from Sir Thomas Elyot; Eliot modernised it because it puzzled readers."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 931"
      status: verified

- movement: 1
  lemma: "electric heat"
  hint: 19
  kind: sense
  gloss: "Charged, thundery heat. Eliot recalled walking from East to West Coker ‘in great heat’ in August 1937."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, pp. 926, 932"
      status: verified

- movement: 1
  lemma: "refracted"
  hint: 21
  kind: sense
  gloss: "Bent or broken, as light is when it passes from one medium into another. Eliot later admitted the word puzzled readers: he wanted the old sense ‘broken back’, and rejected *reflected* because it suggested the glare of a mirror."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 932"
      status: verified

- movement: 1
  lemma: "dahlias"
  hint: 22
  kind: name
  gloss: "Late-summer garden flowers with large many-petalled heads."
  say: "daylias"
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 932"
      status: verified

- movement: 1
  lemma: "daunsinge"
  hint: 30
  kind: archaic
  gloss: "Dancing, in the spelling of Sir Thomas Elyot's *The Governour* (1531), from which this and the next lines are taken. Eliot's recording simply says *dancing*."
  say: "dancing"
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, pp. 933–34"
      status: verified

- movement: 1
  lemma: "commodious"
  hint: 31
  kind: archaic
  gloss: "Beneficial, advantageous: the Tudor sense, not ‘roomy’."

- movement: 1
  lemma: "coniunction"
  hint: 32
  kind: archaic
  gloss: "Conjunction, in Tudor spelling (*i* for *j*): a joining together, here of man and woman in marriage."

- movement: 1
  lemma: "betokeneth concorde"
  hint: 34
  kind: archaic
  gloss: "Signifies harmony."

- movement: 1
  lemma: "loam"
  hint: 38
  kind: sense
  gloss: "Rich, crumbly soil of clay, sand and decayed plant matter."

- movement: 1
  lemma: "Dawn points"
  hint: 48
  kind: sense
  gloss: "Dawn begins to show. F. R. Leavis traced the phrase to the French *poindre* and *point du jour*, daybreak; Milton has ‘the point of dawn’."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, pp. 934–35"
      status: verified

- movement: 2
  lemma: "hollyhocks"
  hint: 5
  kind: name
  gloss: "Tall cottage-garden flowers that grow in spikes on long stems."

- movement: 2
  lemma: "Simulates"
  hint: 9
  kind: sense
  gloss: "Imitates, gives a false appearance of."

- movement: 2
  lemma: "triumphal cars"
  hint: 9
  kind: sense
  gloss: "The chariots of a Roman triumph, the victory procession of a conquering general; in poetry, also the chariots of the sun and moon."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 936"
      status: verified

- movement: 2
  lemma: "constellated"
  hint: 10
  kind: sense
  gloss: "Formed into constellations: the wars are fought out among the star groups."

- movement: 2
  lemma: "Scorpion"
  hint: 11
  kind: name
  gloss: "Scorpio, the constellation of the zodiac through which the sun passes from late October to late November."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 937"
      status: verified

- movement: 2
  lemma: "Leonids"
  hint: 13
  kind: name
  gloss: "The meteor shower that seems to radiate from the constellation Leo each November. Newspapers of the 1930s promised fine displays in late November."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 936"
      status: verified

- movement: 2
  lemma: "vortex"
  hint: 15
  kind: technical
  gloss: "A whirlpool or whirlwind; in older astronomy, a whirling mass of matter that carries the planets round."

- movement: 2
  lemma: "ice-cap"
  hint: 17
  kind: sense
  gloss: "A permanent sheet of ice, as over the poles: the world is imagined ending first in fire, then in ice."

- movement: 2
  lemma: "periphrastic"
  hint: 19
  kind: sense
  gloss: "Roundabout; saying something in more words than it needs."

- movement: 2
  lemma: "receipt"
  hint: 27
  kind: archaic
  gloss: "A recipe or formula: something that can be bequeathed, as Eliot pointed out when John Hayward queried the word."
  sources:
    - ref: ricks-mccue-2015
      locator: "vol. I, p. 938"
      status: verified

- movement: 2
  lemma: "hebetude"
  hint: 28
